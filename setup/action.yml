name: "Setup"
inputs: {}
runs:
  using: "composite"
  steps:
    - name: "Checkout"
      shell: "sh"
      env:
        SERVER: "${{ github.server_url }}"
      run: |
        proto="${SERVER%%://*}"
        host="${SERVER#*://}"
        git config --global --add safe.directory "$(pwd)"
        git config --global --add advice.detachedHead "false"
        git clone "${proto}://oauth2:${{ github.token }}@${host}/${{ github.repository }}" .
        git -c advice.detachedHead=false checkout ${{ github.sha }}

    - name: "Copy Task Binary"
      shell: "sh"
      run:  |
        tar -x -C /usr/local/bin --no-same-owner -f "${GITHUB_ACTION_PATH}/task_linux_amd64.tar.gz" task
